# Fork-only image publishing.
#
# Deliberately separate from `publish_docker_image.yml` (upstream's workflow,
# which pushes to Docker Hub under `evoapicloud` using secrets this fork does
# not have, and only runs on `main`). Keeping this in its own file means
# syncing a new upstream release never conflicts with it.
#
# Publishes to GHCR under the repository owner's namespace — that is the only
# namespace `GITHUB_TOKEN` can write to, so no PAT or repo secret is needed.
name: Publish image to GHCR

on:
  push:
    branches:
      - fix/admin-revoke-participant
  workflow_dispatch:

jobs:
  build_publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.0')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/evolution-go
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-participant-delete
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          # amd64 only: the target is a single x86 VPS. Upstream also builds
          # arm64, but this image is built with CGO_ENABLED=1, so an arm64
          # build here would cross-compile under QEMU emulation and take far
          # longer for no benefit. Add `linux/arm64` back if an ARM host ever
          # needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}-participant-delete

      - name: Summary
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "digest: ${{ steps.docker_build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
